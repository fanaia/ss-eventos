name: extract-backend-test-failures

on:
  push:
    branches: [agent/integracao-omie-mvp]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integracao-omie-mvp

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Extrair falhas
        shell: bash
        run: |
          set +e
          npm ci --prefix backend > /dev/null 2>&1
          install_status=$?
          test_status=99
          if [ "$install_status" -eq 0 ]; then
            (cd backend && node --test --test-reporter=spec) > "$RUNNER_TEMP/tests.log" 2>&1
            test_status=$?
          else
            echo "Falha na instalação" > "$RUNNER_TEMP/tests.log"
          fi

          awk '
            /^✖ / { printing=1; remaining=35; failure+=1; print "\n## Falha " failure "\n"; }
            printing { print; remaining--; if (remaining <= 0) printing=0 }
          ' "$RUNNER_TEMP/tests.log" > "$RUNNER_TEMP/failures.txt"

          {
            echo "# Falhas resumidas dos testes backend"
            echo
            echo "- Instalação: \`$install_status\`"
            echo "- Testes: \`$test_status\`"
            echo "- Total de falhas identificadas: \`$(grep -c '^✖ ' "$RUNNER_TEMP/tests.log")\`"
            cat "$RUNNER_TEMP/failures.txt"
          } > .github/backend-test-failures.md

          rm .github/workflows/extract-backend-test-failures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/extract-backend-test-failures.yml .github/backend-test-failures.md
          git commit -m "ci: registrar resumo das falhas backend"
          git push origin HEAD:agent/integracao-omie-mvp

          if [ "$install_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then exit 1; fi
