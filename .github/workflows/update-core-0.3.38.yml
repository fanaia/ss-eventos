name: update-core-0.3.38

on:
  push:
    branches: [fix/atualizar-core-0.3.38]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atualizar-core-0.3.38

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Aguardar publicação do OonCore Front 0.3.38
        run: |
          for tentativa in {1..20}; do
            if npm view @oondemand/oon-core-front@0.3.38 version; then
              exit 0
            fi
            echo "Pacote ainda não publicado; nova tentativa em 30 segundos ($tentativa/20)."
            sleep 30
          done
          echo "OonCore Front 0.3.38 não foi publicado no prazo esperado."
          exit 1

      - name: Atualizar dependência e lockfile
        working-directory: frontend
        run: npm install --package-lock-only --save-exact @oondemand/oon-core-front@0.3.38

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Registrar atualização e remover workflow temporário
        run: |
          rm .github/workflows/update-core-0.3.38.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .github/workflows/update-core-0.3.38.yml
          git commit -m "chore(frontend): atualizar OonCore para 0.3.38"
          git push origin HEAD:fix/atualizar-core-0.3.38
