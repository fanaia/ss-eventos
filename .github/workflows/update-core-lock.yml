name: update-core-lock

on:
  push:
    branches: [fix/projeto-pagamentos-aprovacao]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/projeto-pagamentos-aprovacao

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Confirmar versão publicada
        run: |
          npm view @oondemand/oon-core-back@0.3.37 version
          npm view @oondemand/oon-core-front@0.3.37 version

      - name: Atualizar Core Back
        working-directory: backend
        run: npm install --package-lock-only --save-exact @oondemand/oon-core-back@0.3.37

      - name: Atualizar Core Front
        working-directory: frontend
        run: npm install --package-lock-only --save-exact @oondemand/oon-core-front@0.3.37

      - name: Registrar locks atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "chore: atualizar OonCore para 0.3.37"
          git push origin HEAD:fix/projeto-pagamentos-aprovacao
